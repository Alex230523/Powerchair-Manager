services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: pfm
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pfm_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm -d pfm"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pfm_pg:
