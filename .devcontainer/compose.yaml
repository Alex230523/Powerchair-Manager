# Development only. The app container shares the database network namespace,
# so PostgreSQL is reachable on localhost:5432 like in a local install.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    network_mode: service:db
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfm
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm_local_only
    volumes:
      - pfm_devcontainer_pg:/var/lib/postgresql
volumes:
  pfm_devcontainer_pg:
