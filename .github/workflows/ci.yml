name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Security (06/11/2026): the workflow's token reads the code, nothing more.
permissions:
  contents: read

env:
  DATABASE_URL: postgresql://pfm:pfm_ci@localhost:5432/pfm
  # Security (07/11/2026): the test robots go far faster than a person; the limits are raised, never removed.
  PFM_RATE_LIMIT_SCALE: "1000"

jobs:
  verify:
    name: Lint, types, tests, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pfm
          POSTGRES_USER: pfm
          POSTGRES_PASSWORD: pfm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pfm -d pfm"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Security (07/11/2026): every package at its exact version, against the known flaws
      # and the malicious versions (OSV), and each one signed by the npm registry.
      - name: "Dependencies: known flaws and malicious versions"
        run: node scripts/check-deps.mjs
      - name: "Dependencies: registry signatures"
        run: npm audit signatures
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_URL=http://127.0.0.1:3000"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 48)"
            echo "PFM_LOCAL_MAIL=true"
            echo "MAIL_TRANSPORT=local"
          } > .env.local
      - name: Lint (errors also shown as annotations on the pull request)
        run: |
          npx --no-install eslint . -f json -o eslint-report.json || {
            node -e 'for (const f of require("./eslint-report.json")) for (const m of f.messages.filter((m) => m.severity === 2)) console.log(`::${m.severity === 2 ? "error" : "warning"} file=${f.filePath.replace(process.cwd() + "/", "")},line=${m.line ?? 1},col=${m.column ?? 1}::${(m.ruleId ?? "eslint") + ": " + m.message.replace(/\n/g, " ")}`)'
            exit 1
          }
      - name: Types
        run: scripts/ci-annotate.sh "Types" npm run typecheck
      - name: Unit tests
        run: scripts/ci-annotate.sh "Unit tests" npm test
      - name: Migrations (twice, must be idempotent)
        run: npm run db:migrate && npm run db:migrate && npm run db:test
      - name: Integration tests
        run: scripts/ci-annotate.sh "Integration tests" npm run test:integration
      - name: Demo data
        run: npm run demo:seed && npm run demo:seed
      - name: Backup and restore on a throwaway database (B2)
        run: |
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          export PATH=/usr/lib/postgresql/18/bin:$PATH BACKUP_PASSPHRASE=$(openssl rand -hex 24)
          psql "$DATABASE_URL" -c "CREATE DATABASE pfm_restore"
          scripts/backup.sh ci-backup.dump.enc
          RESTORE_URL=postgresql://pfm:pfm_ci@localhost:5432/pfm_restore SOURCE_URL="$DATABASE_URL" scripts/restore-check.sh ci-backup.dump.enc
      - name: Build
        run: scripts/ci-annotate.sh "Build" scripts/build-retry.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pfm
          POSTGRES_USER: pfm
          POSTGRES_PASSWORD: pfm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pfm -d pfm"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_URL=http://127.0.0.1:3100"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 48)"
          } > .env.local
      - name: Build (failures shown as annotations; Playwright reuses the output)
        run: scripts/ci-annotate.sh "Build for end-to-end" scripts/build-retry.sh
        env:
          PFM_BUILD_DIR: .next-e2e
          PFM_LOCAL_MAIL: "true"
          PFM_MAIL_DIR: .local/mail-e2e
      - name: End-to-end tests
        run: scripts/ci-annotate.sh "End-to-end" npm run test:e2e:db
      # The page as the failed test saw it (accessibility tree), readable in the log without downloading the artifact.
      - name: Page snapshots of the failed tests
        if: failure()
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r f; do
            echo "::group::$f"
            head -n 250 "$f"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Audits (display and rights)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pfm
          POSTGRES_USER: pfm
          POSTGRES_PASSWORD: pfm_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pfm -d pfm"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BETTER_AUTH_URL=http://127.0.0.1:3100"
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 48)"
          } > .env.local
      - name: Build
        run: scripts/ci-annotate.sh "Build for the audits" scripts/build-retry.sh
        env:
          PFM_BUILD_DIR: .next-e2e
          PFM_LOCAL_MAIL: "true"
          PFM_MAIL_DIR: .local/mail-e2e
      # 23 and 26: the matrix is filled and the findings reviewed; any difference now fails.
      - name: Rights matrix (npm run audit:access)
        run: npm run audit:access
      - name: Display audit (npm run audit:ui)
        if: always()
        run: npm run audit:ui
      # G10: the how-to captures; a changed screen is reported (never fails the run), new captures land in the report.
      - name: How-to captures (npm run audit:help)
        if: always()
        continue-on-error: true
        run: npm run audit:help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit-report
          path: audit-report/
          retention-days: 14
          if-no-files-found: ignore
